<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      text-align: center;
      background: linear-gradient(135deg, #232f3e, #37475a);
    }
    .box { padding: 20px; }
    .big { font-size: 90px; margin: 0; color: #ff9900; }
    .emoji { font-size: 60px; animation: spin 4s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    a {
      display: inline-block;
      margin-top: 20px;
      background: #06d6a0;
      color: #111;
      text-decoration: none;
      font-weight: bold;
      padding: 12px 26px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="emoji">&#128752;</div>
    <h1 class="big">404</h1>
    <h2>Oops! This page floated away into the cloud.</h2>
    <p>The page you are looking for doesn't exist.</p>
    <a href="./index.html">Take me home</a>
  </div>
</body>
</html>
